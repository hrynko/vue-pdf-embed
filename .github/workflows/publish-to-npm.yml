name: Publish to npm

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write

env:
  HUSKY: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm publish
